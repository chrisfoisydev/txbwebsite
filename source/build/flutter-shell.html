<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BECU member experience · treXis</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#f7f6f5;color:#16323b;font:13px system-ui,sans-serif}header{min-height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 20px;border-bottom:1px solid #dce4e5;background:#fff}a{color:#006e7a;text-decoration:none;font-weight:600}a:hover{text-decoration:underline}a:focus-visible,button:focus-visible{outline:3px solid #d82434;outline-offset:3px}.context{color:#526970;font-size:12px}form{margin:0}button{border:1px solid #cbd7d9;border-radius:20px;padding:7px 14px;background:white;color:#16323b;cursor:pointer}
    .app-layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,320px) minmax(0,450px);justify-content:center;gap:64px;padding:0 32px;background:radial-gradient(ellipse at center,#fff,#f2f4f3)}
    .app-note{align-self:center;border-left:3px solid #d82434;padding-left:24px}
    .source-note{font-size:17px;line-height:1.65;margin:0;color:#16323b}.source-note strong{display:block;font-size:22px;line-height:1.3;margin-bottom:12px}
    .designer-note{font-size:12px;line-height:1.7;margin:24px 0 0;color:#526970}
    .app-stage{min-width:0;min-height:0;display:flex;justify-content:center;align-items:center;padding:24px 0}
    .phone-shell{position:relative;flex-shrink:0;width:402px;height:875px;border-radius:20px;overflow:hidden;visibility:hidden;background:#fff;box-shadow:0 18px 55px #00343c20,0 0 0 1px #00343c18}
    .app-frame{position:absolute;inset:0 auto auto 0;width:402px;height:875px;transform:scale(var(--phone-scale,1));transform-origin:top left}
    iframe{display:block;width:100%;height:100%;border:0}
    @media(max-width:800px){.app-layout{display:flex;flex-direction:column;gap:0;padding:0 16px}.app-note{max-width:560px;padding:18px 0 0;border:0;text-align:center}.source-note{font-size:13px;line-height:1.5}.source-note strong{font-size:16px;margin-bottom:4px}.designer-note{font-size:11px;line-height:1.5;margin-top:10px}.app-stage{flex:1;padding:16px 0}}
    @media(max-width:600px){header{padding:8px 12px;gap:8px;font-size:11px}.context{font-size:10px}button{font-size:11px;padding:6px 10px}}
  </style>
</head>
<body>
  <header><a href="/#together">← Back to the story</a><span class="context">BECU experience · Sample data</span><form method="post" action="/__access/logout"><button type="submit">Lock site</button></form></header>
  <main class="app-layout">
    <aside class="app-note" aria-label="About this Flutter app">
      <p class="source-note"><strong>This is actual treXis source code.</strong>All data on the screen has been mapped to our API.</p>
      <p class="designer-note">This flutter app was coded by Chris Foisy | BECU Staff Product Designer to showcase the ease-of-use and fast implementation of the treXis platform.</p>
    </aside>
    <div class="app-stage"><div class="phone-shell"><div class="app-frame"><iframe src="/app/flutter/" title="BECU Flutter member experience"></iframe></div></div></div>
  </main>
  <script>
    // Keep Flutter's phone viewport fixed; fit the whole device without reflowing its UI.
    const phone = document.querySelector('.phone-shell');
    new ResizeObserver(([entry]) => {
      const { width, height } = entry.contentRect;
      const scale = Math.min(1, Math.max(0, width) / 402, Math.max(0, height) / 875);
      phone.style.width = `${402 * scale}px`;
      phone.style.height = `${875 * scale}px`;
      phone.style.setProperty('--phone-scale', String(scale));
      phone.style.visibility = scale > 0 ? 'visible' : 'hidden';
    }).observe(document.querySelector('.app-stage'));
  </script>
</body>
</html>
